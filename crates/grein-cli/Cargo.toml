[package]
name = "grein-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "grein"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
grein-tui = { path = "../grein-tui" }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"