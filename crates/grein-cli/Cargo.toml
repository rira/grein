[package]
name = "grein-cli"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true

[dependencies]
grein-core = { path = "../grein-core" }
grein-acp = { path = "../grein-acp" }
grein-workspace = { path = "../grein-workspace" }
grein-tui = { path = "../grein-tui" }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[[bin]]
name = "grein"
path = "src/main.rs"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1"
tempfile = "3"