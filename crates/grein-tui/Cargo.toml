[package]
name = "grein-tui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
grein-core = { path = "../grein-core" }
ratatui = ">=0.26, <=0.29"
crossterm = ">=0.27, <=0.28"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
thiserror = ">=1.0, <=2.0"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"