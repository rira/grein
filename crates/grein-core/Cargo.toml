[package]
name = "grein-core"
version = "0.1.0"
edition = "2021"
authors.workspace = true
license.workspace = true

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = ">=0.30, <=0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = ">=1.0, <=2.0"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }