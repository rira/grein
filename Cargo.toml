[workspace]
resolver = "2"
members = [
    "crates/grein-core",
    "crates/grein-acp",
    "crates/grein-workspace",
    "crates/grein-tui",
    "crates/grein-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Richard"]
repository = "https://github.com/rira/grein"

[workspace.dependencies]
tokio = { version = "1.41", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v7", "serde"] }
pulldown-cmark = "0.12"
similar = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
clap = { version = "4.5", features = ["derive", "env"] }

# Internal workspace crates
grein-core = { path = "crates/grein-core" }
grein-acp = { path = "crates/grein-acp" }
grein-workspace = { path = "crates/grein-workspace" }
grein-tui = { path = "crates/grein-tui" }
