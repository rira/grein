[workspace]
members = [
    "crates/grein-core",
    "crates/grein-acp",
    "crates/grein-workspace",
    "crates/grein-tui",
    "crates/grein-cli",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Richard <rira>"]
license = "MIT"
description = "Terminal-native workspace for branching AI coding sessions, git worktrees, and embedded shells"
homepage = "https://github.com/rira/grein"
repository = "https://github.com/rira/grein"