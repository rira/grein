name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or ref label (e.g. v0.1.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          RAW_TAG="${INPUT_TAG:-$REF_NAME}"
          TAG="${RAW_TAG//\//-}"
          if ! [[ "$TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          {
            echo "TAG=$TAG"
            echo "VERSION=${TAG#v}"
          } >> "$GITHUB_ENV"

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          expected = os.environ["VERSION"]
          cargo_version = None

          try:
              import tomllib
          except ImportError:
              try:
                  import tomli as tomllib
              except ImportError:
                  tomllib = None

          if tomllib is not None:
              with open("Cargo.toml", "rb") as f:
                  data = tomllib.load(f)
              cargo_version = data.get("workspace", {}).get("package", {}).get("version")
          else:
              with open("Cargo.toml", "r", encoding="utf-8") as f:
                  in_workspace_pkg = False
                  for raw_line in f:
                      line = raw_line.split("#", 1)[0].strip()
                      if not line:
                          continue
                      if line.startswith("["):
                          in_workspace_pkg = bool(re.match(r"^\[workspace\.package\]$", line))
                          continue
                      if in_workspace_pkg:
                          match = re.match(r'^version\s*=\s*["\']([^"\']+)["\']$', line)
                          if match:
                              cargo_version = match.group(1)
                              break

          if not cargo_version:
              print("Failed to read [workspace.package].version from Cargo.toml", file=sys.stderr)
              sys.exit(1)

          if cargo_version != expected:
              print(
                  f"Release tag version '{expected}' does not match Cargo.toml [workspace.package].version '{cargo_version}'",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Verified release tag version '{expected}' matches Cargo.toml")
          PY

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --package grein-cli --target "$TARGET"

      - name: Smoke-test native binary version
        if: matrix.target != 'x86_64-apple-darwin'
        env:
          TARGET: ${{ matrix.target }}
          IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          BIN_PATH="target/${TARGET}/release/grein"
          VERSION_OUTPUT="$("$BIN_PATH" --version)"
          echo "Binary version output: $VERSION_OUTPUT"
          if ! printf '%s\n' "$VERSION_OUTPUT" | grep -q '^grein '; then
            echo "Unexpected --version output: $VERSION_OUTPUT" >&2
            exit 1
          fi
          if [ "$IS_RELEASE_TAG" = "true" ] && ! printf '%s\n' "$VERSION_OUTPUT" | grep -qF "$VERSION"; then
            echo "Expected --version output '$VERSION_OUTPUT' to contain '$VERSION'" >&2
            exit 1
          fi

      - name: Package release archive and checksum
        env:
          TARGET: ${{ matrix.target }}
        run: |
          BIN_PATH="target/${TARGET}/release/grein"
          if [ "${RUNNER_OS}" = "macOS" ]; then
            strip -x "$BIN_PATH"
            codesign --force --sign - "$BIN_PATH"
          else
            strip "$BIN_PATH"
          fi

          rm -rf stage dist
          mkdir -p stage dist
          cp "$BIN_PATH" stage/grein
          chmod +x stage/grein
          cp LICENSE README.md stage/

          ARCHIVE="grein-${TAG}-${TARGET}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "dist/${ARCHIVE}" -C stage .

          (
            cd dist
            if [ "${RUNNER_OS}" = "macOS" ]; then
              shasum -a 256 "$ARCHIVE" > "${ARCHIVE}.sha256"
            else
              sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
            fi
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate and verify SHA256SUMS
        run: |
          (
            cd dist
            rm -f SHA256SUMS
            cat *.sha256 > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true

  update-homebrew-tap:
    name: Update Homebrew Tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    env:
      HAS_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}

    steps:
      - name: Require HOMEBREW_TAP_TOKEN secret
        if: env.HAS_HOMEBREW_TAP_TOKEN != 'true'
        run: |
          echo "::error::HOMEBREW_TAP_TOKEN secret is not configured; cannot update rira/homebrew-tap." >&2
          exit 1

      - name: Download build artifacts
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checkout rira/homebrew-tap
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: rira/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update and push Homebrew formula
        if: env.HAS_HOMEBREW_TAP_TOKEN == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          VERSION="${TAG#v}"

          read_sha() {
            local target="$1"
            local file="dist/grein-${TAG}-${target}.tar.gz.sha256"
            if [ ! -f "$file" ]; then
              echo "Missing checksum file: $file" >&2
              exit 1
            fi
            local sha
            sha=$(awk '{print $1}' "$file")
            if ! [[ "$sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Invalid SHA256 in $file: $sha" >&2
              exit 1
            fi
            printf '%s' "$sha"
          }

          SHA_MACOS_ARM="$(read_sha aarch64-apple-darwin)"
          SHA_MACOS_INTEL="$(read_sha x86_64-apple-darwin)"
          SHA_LINUX_ARM="$(read_sha aarch64-unknown-linux-gnu)"
          SHA_LINUX_INTEL="$(read_sha x86_64-unknown-linux-gnu)"

          mkdir -p tap/Formula
          sed 's/^          //' > tap/Formula/grein.rb <<EOF
          class Grein < Formula
            desc "Terminal workspace for branching AI sessions, git worktrees, and shells"
            homepage "https://github.com/rira/grein"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/rira/grein/releases/download/${TAG}/grein-${TAG}-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              end

              on_intel do
                url "https://github.com/rira/grein/releases/download/${TAG}/grein-${TAG}-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_INTEL}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/rira/grein/releases/download/${TAG}/grein-${TAG}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end

              on_intel do
                url "https://github.com/rira/grein/releases/download/${TAG}/grein-${TAG}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
            end

            def install
              bin.install "grein"
            end

            test do
              assert_match version.to_s, shell_output("#{bin}/grein --version")
            end
          end
          EOF

          command -v ruby >/dev/null || (sudo apt-get update && sudo apt-get install -y --no-install-recommends ruby)
          ruby -c tap/Formula/grein.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/grein.rb
          if git diff --cached --quiet; then
            echo "Formula/grein.rb is already up to date for ${TAG}"
          else
            git commit -m "chore(formula): update grein to ${VERSION}"
            git push
          fi
